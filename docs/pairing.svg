<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif">
  <rect x="1" y="1" width="758" height="328" rx="18" fill="#F5F8FF" stroke="#DCE6FF" stroke-width="2"/>

  <!-- Mac: show a code -->
  <text x="190" y="38" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Mac: กด Show a code</text>
  <rect x="34" y="54" width="312" height="200" rx="12" fill="#fff" stroke="#D1D5DB"/>
  <text x="58" y="88" font-size="14" font-weight="700" fill="#111827">clipsync</text>
  <text x="58" y="124" font-size="14" fill="#374151">Pairing code:</text>
  <text x="58" y="166" font-size="36" font-weight="700" fill="#1D4ED8" letter-spacing="2">482 913</text>
  <rect x="50" y="134" width="190" height="46" rx="8" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <text x="58" y="204" font-size="12" fill="#6B7280">On the other computer, choose to type</text>
  <text x="58" y="220" font-size="12" fill="#6B7280">a code and enter this one.</text>
  <rect x="262" y="220" width="70" height="24" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="297" y="236.5" font-size="12" fill="#111827" text-anchor="middle">Cancel</text>

  <!-- arrow -->
  <path d="M356,156 H392" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M390,146 L402,156 L390,166 z" fill="#2563EB"/>
  <text x="378" y="186" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">พิมพ์รหัสนี้</text>

  <!-- Windows: type the code -->
  <text x="574" y="38" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Windows: พิมพ์ 2 แล้วพิมพ์รหัส</text>
  <rect x="412" y="54" width="332" height="200" rx="6" fill="#0C0C0C"/>
  <rect x="412" y="54" width="332" height="24" rx="6" fill="#2B2B2B"/>
  <text x="424" y="70" font-size="11" fill="#D1D5DB">clipsync — pairing</text>
  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="10.5" fill="#E5E7EB">
    <text x="424" y="100">Pair it with your other computer:</text>
    <text x="424" y="118">  1) Show a pairing code on this computer</text>
    <text x="424" y="136">  2) Type the code shown on the other computer</text>
    <text x="424" y="160">Choose 1 or 2: <tspan fill="#FCD34D" font-weight="700">2</tspan></text>
    <text x="424" y="180">Code: <tspan fill="#FCD34D" font-weight="700">482913</tspan></text>
    <text x="424" y="204">Looking for the other computer...</text>
    <text x="424" y="230" fill="#86EFAC" font-weight="700">Paired with MacBook.</text>
  </g>

  <text x="380" y="284" font-size="14" fill="#111827" text-anchor="middle">จะสลับกันก็ได้: ให้ Windows แสดงรหัส (พิมพ์ 1) แล้ว Mac กด Type a code</text>
  <text x="380" y="308" font-size="13" fill="#4B5563" text-anchor="middle">ทำแค่ครั้งเดียว ครั้งต่อไปสองเครื่องจะจำกันเอง</text>
</svg>
