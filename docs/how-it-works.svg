  <rect x="84" y="132" width="62" height="18" rx="5" fill="#2563EB"/>
  <text x="115" y="145.5" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Ctrl+C</text>
  <rect x="140" y="170" width="30" height="20" fill="#374151"/>
  <rect x="110" y="190" width="90" height="8" rx="4" fill="#374151"/>
  <text x="155" y="226" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Windows</text>

  <!-- Mac -->
  <rect x="520" y="56" width="170" height="108" rx="10" fill="#1F2937"/>
  <rect x="530" y="66" width="150" height="90" rx="4" fill="#E8F0FF"/>
  <rect x="544" y="80" width="100" height="9" rx="4" fill="#C3D5FA"/>
  <rect x="544" y="98" width="122" height="9" rx="4" fill="#93B4F5"/>
  <rect x="544" y="128" width="62" height="18" rx="5" fill="#2563EB"/>
  <text x="575" y="141.5" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">⌘V</text>
  <path d="M500,164 H710 L698,182 H512 Z" fill="#9CA3AF"/>
  <text x="605" y="226" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Mac</text>

  <!-- arrows -->
  <path d="M262,92 C320,40 440,40 498,92" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M498,150 C440,202 320,202 262,150" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" marker-end="url(#head)"/>
  <text x="380" y="38" font-size="15" font-weight="600" fill="#1E3A8A" text-anchor="middle">copy เครื่องหนึ่ง วางอีกเครื่องได้ทันที</text>
  <text x="380" y="212" font-size="15" font-weight="600" fill="#1E3A8A" text-anchor="middle">ได้ทั้งสองทาง ทั้งข้อความและรูป</text>

  <!-- clipsync icon -->
  <rect x="348" y="90" width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x="363" y="103" width="34" height="43" rx="5" fill="#fff"/>
  <rect x="372" y="98" width="16" height="9" rx="3" fill="#DBEAFE"/>
  <path d="M371,123 a9,9 0 0 1 15,-6" fill="none" stroke="#2563EB" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M389,127 a9,9 0 0 1 -15,6" fill="none" stroke="#2563EB" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M384,112 l5,4 l-6,2 z" fill="#2563EB"/>
  <path d="M376,138 l-5,-4 l6,-2 z" fill="#2563EB"/>

  <text x="380" y="252" font-size="14" fill="#4B5563" text-anchor="middle">Wi-Fi เดียวกัน  ·  เข้ารหัสทุกครั้ง  ·  ไม่ผ่านเซิร์ฟเวอร์ของใคร</text>
