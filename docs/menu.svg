<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="758" height="328" rx="18" fill="#F5F8FF" stroke="#DCE6FF" stroke-width="2"/>

  <!-- icon -->
  <rect x="40" y="24" width="30" height="30" rx="7" fill="url(#tile)"/>
  <rect x="47" y="30" width="16" height="20" rx="3" fill="#fff"/>
  <rect x="51" y="27" width="8" height="5" rx="2" fill="#DBEAFE"/>
  <text x="82" y="44" font-size="13" fill="#374151">คลิกไอคอนนี้ (แถบเมนูบน Mac / ข้างนาฬิกาบน Windows)</text>

  <!-- menu -->
  <rect x="40" y="66" width="300" height="244" rx="10" fill="#fff" stroke="#D1D5DB"/>
  <g font-size="14">
    <text x="58" y="94" fill="#9CA3AF">Connected to MacBook</text>
    <text x="58" y="120" fill="#9CA3AF">Last: Sent text, 12 characters (09:41)</text>
    <line x1="50" y1="134" x2="330" y2="134" stroke="#E5E7EB"/>
    <text x="58" y="158" fill="#111827">Pause syncing</text>
    <text x="58" y="186" fill="#111827"><tspan font-weight="700">✓</tspan>  Start at login</text>
    <text x="58" y="214" fill="#111827">Pair with another computer...</text>
    <text x="58" y="242" fill="#111827">Open log</text>
    <line x1="50" y1="258" x2="330" y2="258" stroke="#E5E7EB"/>
    <text x="58" y="286" fill="#111827">Quit clipsync</text>
  </g>

  <!-- explanations -->
  <g font-size="13.5" fill="#1E3A8A">
    <line x1="348" y1="90" x2="372" y2="90" stroke="#93B4F5" stroke-width="2"/>
    <text x="380" y="95">สถานะ: ต่ออยู่ หรือกำลังรออีกเครื่อง</text>
    <line x1="348" y1="116" x2="372" y2="116" stroke="#93B4F5" stroke-width="2"/>
    <text x="380" y="121">สิ่งที่ส่งหรือรับล่าสุด</text>
    <line x1="348" y1="154" x2="372" y2="154" stroke="#93B4F5" stroke-width="2"/>
    <text x="380" y="159">หยุดส่งและรับชั่วคราว</text>
    <line x1="348" y1="182" x2="372" y2="182" stroke="#93B4F5" stroke-width="2"/>
    <text x="380" y="187">เปิดเองตอนเปิดเครื่อง (ติ๊กไว้ให้แล้ว)</text>
    <line x1="348" y1="210" x2="372" y2="210" stroke="#93B4F5" stroke-width="2"/>
    <text x="380" y="215">จับคู่ใหม่ เช่นเปลี่ยนเครื่อง</text>
    <line x1="348" y1="238" x2="372" y2="238" stroke="#93B4F5" stroke-width="2"/>
    <text x="380" y="243">ดูบันทึก ไว้หาสาเหตุเวลามีปัญหา</text>
    <line x1="348" y1="282" x2="372" y2="282" stroke="#93B4F5" stroke-width="2"/>
    <text x="380" y="287">ปิดโปรแกรม</text>
  </g>
</svg>
